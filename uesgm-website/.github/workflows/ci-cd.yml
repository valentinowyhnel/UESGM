name: CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: uesgm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: uesgm-website/pnpm-lock.yaml

      - name: Install dependencies
        run: cd uesgm-website && pnpm install

      - name: Generate Prisma Client
        run: cd uesgm-website && pnpm prisma generate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/uesgm_test

      - name: Run lint
        run: cd uesgm-website && pnpm lint

      - name: Run tests
        run: cd uesgm-website && pnpm test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/uesgm_test
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Build
        run: cd uesgm-website && pnpm build
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/uesgm_test
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: https://uesgm.ma
