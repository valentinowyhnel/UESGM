name: UESGM CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: uesgm-website/pnpm-lock.yaml

      - name: Install dependencies
        run: cd uesgm-website && pnpm install

      - name: Lint
        run: cd uesgm-website && pnpm lint

      - name: Typecheck
        run: cd uesgm-website && pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: uesgm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: uesgm-website/pnpm-lock.yaml

      - name: Install dependencies
        run: cd uesgm-website && pnpm install

      - name: Generate Prisma Client
        run: cd uesgm-website && pnpm prisma generate

      - name: Run migrations
        run: cd uesgm-website && pnpm prisma db push
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/uesgm_test

      - name: Run tests
        run: cd uesgm-website && pnpm test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/uesgm_test
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

  build:
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: uesgm-website/pnpm-lock.yaml

      - name: Install dependencies
        run: cd uesgm-website && pnpm install

      - name: Build
        run: cd uesgm-website && pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production
        run: echo "Deployment step for Vercel/Render/etc."
        # Uses platform specific CLI or webhook
